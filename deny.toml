# cargo-deny — a bancada segue o ADR-0004 do Chess Studio: MIT OR Apache-2.0, nada da família GPL.
# Execute: cargo deny check licenses

[graph]
all-features = false

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
# Exceções por crate, só quando inevitáveis e justificadas aqui.
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
