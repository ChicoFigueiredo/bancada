[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bancada-armazem = { path = "crates/bancada-armazem" }
bancada-segredos = { path = "crates/bancada-segredos" }

# SQLite embarcado (MIT; o código C do SQLite é domínio público), a mesma versão do Chess Studio.
rusqlite = { version = "0.41", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
