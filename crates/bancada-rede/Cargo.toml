[package]
name = "bancada-rede"
description = "Portão de rede síncrono: catálogo HTTPS, autorização vinda de um Segredo, limites e backoff, cache com ETag, estado da rede e OAuth por loopback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Servidor HTTP falso em loopback e relógio falso para quem testa por cima do portão. Só para
# testes: nenhum crate liga esta feature em `[dependencies]`.
testes = []

[dependencies]
bancada-armazem.workspace = true
bancada-segredos.workspace = true
rusqlite.workspace = true
# Rede síncrona (como o chess-net de onde veio): HTTP com rustls, sem runtime assíncrono.
# MIT OR Apache-2.0.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Segredos zerados na memória ao descartar (MIT OR Apache-2.0).
zeroize = "1.9"
# Só para ler a resposta do endpoint de token do OAuth (MIT OR Apache-2.0).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PKCE S256: SHA-256, base64url e bytes aleatórios do sistema (MIT OR Apache-2.0).
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
# Teto do log em tempo de compilação: o `ureq-proto` despeja em TRACE os bytes do pedido e da
# resposta, com o `Authorization` e o código do OAuth. Com `max_level_debug`, nenhum
# `log::trace!` existe no binário que tem este crate (MIT OR Apache-2.0).
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }

[dev-dependencies]
bancada-rede = { path = ".", features = ["testes"] }
tempfile = "3"

[lints]
workspace = true
